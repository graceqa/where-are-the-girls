name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Runs nightly at 3:00 AM EDT (07:00 UTC) and every 6 hours
    - cron: '0 7 * * *'
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm run install:all

      - name: Sync Google Calendar Data
        run: npm run sync || echo "Sync skipped, building with existing calendar snapshot"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_CALENDAR_ID: graceandronnyg@gmail.com
          AVERY_CALENDAR_ID: 2e8d9c4b80d785a54e9022b3eab3babdfe2992441f2c14c8db35e3efc1cf6e4c@group.calendar.google.com
          VIOLIN_CALENDAR_ID: e4ea6f97f4fc72cce026a19533683f8156346bc8151862052868da36a845aec5@group.calendar.google.com

      - name: Build client application
        run: GITHUB_PAGES=true npm run build --prefix client

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './client/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
